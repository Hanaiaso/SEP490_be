name: Deploy backend to Azure App Service

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  # TODO: đổi thành tên App Service thật (Azure Portal → App Service → Overview → Name)
  AZURE_WEBAPP_NAME: VietTien
  DOTNET_VERSION: "8.0.x"
  PROJECT_PATH: VietTien.API/VietTien.API.csproj

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore ${{ env.PROJECT_PATH }}

      - name: Publish
        run: dotnet publish ${{ env.PROJECT_PATH }} -c Release -o ${{ github.workspace }}/publish

      - name: Deploy to Azure App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: ${{ github.workspace }}/publish
